{% extends "base.html" %}
{% block title %}Your profile · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Your profile</h1>
  <form class="card card-pad" method="post">
    {% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <div class="form-actions"><button class="btn" type="submit">Save</button><a href="{{ user.get_absolute_url }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
