{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a class="btn small secondary" href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page.previous_page_number }}">&larr; Newer</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn small secondary" href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page.next_page_number }}">Older &rarr;</a>{% endif %}
</nav>
{% endif %}
